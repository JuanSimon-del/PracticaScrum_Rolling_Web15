<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Página no encontrada | RC School</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,800;1,300&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="./css/styles.css" rel="stylesheet" />
    <link href="./css/style404.css" rel="stylesheet" />
  </head>

  <body class="error404-pagina">
    <header class="error404-header">
      <a href="./index.html" aria-label="Rolling Code School — Inicio">
        <img
          class="error404-logo"
          src="./img/logo-rolling-blanco.png"
          alt="Rolling Code School"
        />
      </a>

      <a class="error404-enlaceInicio" href="./index.html">
        Volver al inicio
        <span aria-hidden="true">→</span>

    <main class="error404">
      <div class="error404-ticket">
        <div class="error404-contenido">
          <p class="error404-etiqueta">Destino no encontrado</p>

          <p class="error404-numero">404</p>

          <h1 class="error404-titulo">

          <p class="error404-descripcion">
            Pero todavía podés encontrar tu lugar en el workshop.
          </p>

        <div class="error404-talon" aria-hidden="true">
          <div class="error404-datosTicket">
            <p class="error404-workshop">Workshop</p>
            <p class="error404-codigo">Error 404</p>
          </div>
        </div>
      </div>

      <nav class="error404-acciones" aria-label="Opciones para continuar">
        <a class="error404-boton error404-botonPrincipal" href="./index.html">
          Volver al inicio
          <span aria-hidden="true">→</span>
        </a>

        <a
          class="error404-boton error404-botonSecundario"
          href="./index.html#speakers"
        >
          Ver las charlas
        </a>
      </nav>
    </main>

    <footer class="error404-footer">
      <p>
        ¿Por dónde empiezo a programar? Por el
        <a href="./index.html">inicio</a>.
      </p>
    </footer>
  </body>
</html>
